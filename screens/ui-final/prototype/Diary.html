<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm nhật ký</title>
<link rel="stylesheet" href="./tci.css">
</head>
<body style="background:#E9E9E9;display:flex;justify-content:center;padding:24px 0">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.add{width:96px;height:96px;border-radius:12px;border:1.5px dashed #00A651;background:#fff;color:#00A651;font-family:inherit;font-size:12px;line-height:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.add:hover{background:#E6F6EC}
</style>
</helmet>
<div class="scr w" style="width: 390px; height: 844px">
  <div class="hdr">
    <a href="Timeline.html" class="ib" aria-label="Đóng"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <h1>Thêm nhật ký</h1>
  </div>

  <div class="body" style="gap: 22px">
    <p class="t-cap">Tuần 24 · 28/10/2026 (tự động)</p>

    <div class="fld">
      <p class="lbl">Hôm nay mẹ cảm thấy thế nào? <span class="opt">(không bắt buộc)</span></p>
      <div class="chips">
        <button class="chip on" aria-pressed="true">Vui</button>
        <button class="chip" aria-pressed="false">Bình yên</button>
        <button class="chip" aria-pressed="false">Hồi hộp</button>
        <button class="chip" aria-pressed="false">Mệt</button>
        <button class="chip" aria-pressed="false">Lo lắng</button>
      </div>
    </div>

    <div class="fld">
      <label for="txt">Nội dung</label>
      <textarea id="txt" class="inp" style="height: 180px" placeholder="Con đạp lúc nào, mẹ ăn gì ngon, hay một lời nhắn gửi con…"></textarea>
    </div>

    <div class="fld">
      <p class="lbl">Ảnh <span class="opt">(không bắt buộc)</span></p>
      <button class="add"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Chụp / chọn ảnh</button>
      <p class="t-cap">JPG hoặc PNG, tối đa 5 ảnh, mỗi ảnh 10 MB. Ảnh siêu âm do bệnh viện tự gắn vào ngày khám.</p>
    </div>
  </div>

  <div class="foot">
    <a href="Timeline.html" class="btn o">Hủy</a>
    <a href="Saved.html" class="btn">Lưu nhật ký</a>
  </div>
</div>
</x-dc>
</body>
</html>
