<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhập chỉ số tự theo dõi</title>
<link rel="stylesheet" href="./tci.css">
</head>
<body style="background:#E9E9E9;display:flex;justify-content:center;padding:24px 0">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <div class="hdr">
    <a href="Main.html" class="ib" aria-label="Quay lại"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>Nhập chỉ số tự theo dõi</h1>
  </div>

  <div class="body" style="gap: 12px">
    <p class="t-cap">Nhập chỉ số nào có thì điền, không cần đủ cả 4. Các chỉ số này không xét ngưỡng.</p>

    <div class="card" style="display: flex; flex-direction: column; gap: 10px">
      <p class="t-body b">Cân nặng</p>
      <div class="grid2">
        <div class="unit"><input class="inp" aria-label="Cân nặng" inputmode="decimal" value="58.4"><span>kg</span></div>
        <input class="inp" aria-label="Thời điểm đo cân nặng" value="28/10 · 07:30">
      </div>
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 10px">
      <p class="t-body b">Nhiệt độ</p>
      <div class="grid2">
        <div class="unit"><input class="inp" aria-label="Nhiệt độ" inputmode="decimal" value="36.8"><span>°C</span></div>
        <input class="inp" aria-label="Thời điểm đo nhiệt độ" value="28/10 · 07:30">
      </div>
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 10px">
      <p class="t-body b">Nhịp tim</p>
      <div class="grid2">
        <div class="unit"><input class="inp er" aria-label="Nhịp tim" inputmode="numeric" value="8"><span>bpm</span></div>
        <input class="inp" aria-label="Thời điểm đo nhịp tim" value="28/10 · 07:30">
      </div>
      <p class="err">⚠ Giá trị ngoài khoảng hợp lệ</p>
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 10px">
      <p class="t-body b">Giấc ngủ</p>
      <div class="grid2">
        <div class="fld"><label class="t-cap" for="bt" style="font-weight: 400; font-size: 12px; color: #6F6F6F">Giờ đi ngủ</label><input id="bt" class="inp" value="27/10 · 22:30"></div>
        <div class="fld"><label class="t-cap" for="wk" style="font-weight: 400; font-size: 12px; color: #6F6F6F">Giờ thức dậy</label><input id="wk" class="inp" value="28/10 · 06:00"></div>
      </div>
      <p class="t-cap">Hệ thống tính được: 7 giờ 30 phút</p>
    </div>
  </div>

  <div class="foot">
    <a href="Main.html" class="btn">Lưu chỉ số</a>
  </div>
</div>
</x-dc>
</body>
</html>
