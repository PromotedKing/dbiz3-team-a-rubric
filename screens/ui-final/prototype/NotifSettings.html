<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt thông báo</title>
<link rel="stylesheet" href="./tci.css">
</head>
<body style="background:#E9E9E9;display:flex;justify-content:center;padding:24px 0">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width: 390px; height: 844px">
  <div class="hdr">
    <a href="Profile.html" class="ib" aria-label="Quay lại"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>Cài đặt thông báo</h1>
  </div>

  <div class="body">
    <div class="card np">
      <div class="row">
        <div class="grow"><p class="t-body">Phản hồi báo cáo</p><p class="t-cap">Luôn bật để mẹ không bỏ lỡ phản hồi của nhân viên y tế</p></div>
        <button class="sw on lock" role="switch" aria-checked="true" aria-disabled="true" aria-label="Phản hồi báo cáo, luôn bật"></button>
      </div>
      <div class="row">
        <div class="grow"><p class="t-body">Kết quả khám mới</p><p class="t-cap">Khi bệnh viện cập nhật kết quả lần khám</p></div>
        <button class="sw on" role="switch" aria-checked="true" aria-label="Kết quả khám mới"></button>
      </div>
      <div class="row">
        <div class="grow"><p class="t-body">Nhắc lịch hẹn</p><p class="t-cap">Trước buổi khám 1 ngày</p></div>
        <button class="sw on" role="switch" aria-checked="true" aria-label="Nhắc lịch hẹn"></button>
      </div>
      <div class="row">
        <div class="grow"><p class="t-body">Nhắc theo Chỉ dẫn của bác sĩ</p><p class="t-cap">Nhắc đo và báo cáo chỉ số bác sĩ dặn</p></div>
        <button class="sw" role="switch" aria-checked="false" aria-label="Nhắc theo Chỉ dẫn của bác sĩ"></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
