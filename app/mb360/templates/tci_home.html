{% extends "tci_base.html" %}
{% block content %}
<h2>{{ _("Open Mother & Baby 360 as") }}</h2>
<div class="tile-grid">
  {% for a in accounts %}
  <form class="tile-form" method="post" action="/tci/open">
    {% for f in fields %}<input type="hidden" name="{{ f }}" value="{{ a[f] or '' }}">{% endfor %}
    <button class="tile featured" data-account="{{ a.tci_account_ref }}">
      <span class="feature-icon">{{ icon.heart() }}</span>
      <strong>{{ _("Mother & Baby 360") }}</strong>
      <span>{{ a.full_name }}</span>
      <span class="caption">{{ a.tci_account_ref }}</span>
    </button>
  </form>
  {% endfor %}
</div>

<h2>{{ _("Simulate another TCI account") }}</h2>
<form class="card" method="post" action="/tci/open">
  <label>{{ _("Full name") }}</label><input name="full_name" required>
  <label>{{ _("Date of birth") }}</label><input type="date" name="date_of_birth" required>
  <label>{{ _("Sex") }}</label>
  <select name="sex"><option value="Female">{{ _("Female") }}</option><option value="Male">{{ _("Male") }}</option></select>
  <label>{{ _("Phone number") }}</label><input name="phone" required>
  <label>{{ _("Medical record number (optional)") }}</label><input name="record_code">
  <div class="actions"><button class="btn block">{{ icon.heart() }} {{ _("Mother & Baby 360") }}</button></div>
</form>
<p><a class="link" href="/">{{ _("Demo start page") }} ›</a></p>
{% endblock %}
