<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mother &amp; Baby 360 — clinical web</title>
  <style>
    body { font-family: system-ui, sans-serif; font-size: 13px; margin: 0; color: #222; }
    header { display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #ddd; }
    main { padding: 16px; max-width: 1100px; }
    h1 { font-size: 18px; } h2 { font-size: 15px; }
    table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .chip { display: inline-block; padding: 4px 10px; border: 1px solid #bbb; border-radius: 12px; margin-right: 6px; text-decoration: none; color: #222; }
    .chip.on { background: #7a3b69; color: #fff; border-color: #7a3b69; }
    .label { display: inline-block; border-radius: 8px; padding: 2px 8px; background: #eee; font-size: 11px; }
    .above { background: #f8d7d3; } .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .caption { color: #777; font-size: 11px; } .msg { margin: 4px 0; } .msg.marked { background: #fff4d6; }
    button { padding: 6px 12px; border-radius: 8px; border: 1px solid #7a3b69; background: #7a3b69; color: #fff; cursor: pointer; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <strong>Mother &amp; Baby 360 · Clinical web</strong>
    {% if me %}<span>{% if badge is not none %}Notifications ({{ badge }}) · {% endif %}{% if me.role == "Nurse" %}Nurse: {{ me.full_name }}{% else %}Dr. {{ me.full_name }}{% endif %} · <a href="/staff">change</a></span>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
